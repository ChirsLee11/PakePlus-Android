<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考英语词汇复习</title>
<style>
:root{
  --bg:#FAFAFA;
  --card:#ffffff;
  --ink:#2b3a4a;
  --muted:#8493a3;
  --line:#edf0f3;
  --mint:#2fbf9b;
  --mint-dark:#26a888;
  --mint-soft:#e9f8f3;
  --indigo:#6a7fe0;
  --indigo-dark:#576bd0;
  --indigo-soft:#eef1ff;
  --green:#27ae60;
  --red:#e74c3c;
  --red-soft:#fdecea;
  --shadow:0 8px 28px rgba(31,54,76,.07);
  --shadow-hover:0 12px 30px rgba(31,54,76,.13);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:960px;margin:0 auto;padding:0 18px 48px;}

/* ---------- 顶部 ---------- */
.hero{
  margin:0 -18px 22px;
  padding:30px 18px 26px;
  background:linear-gradient(135deg,#e9f8f3 0%,#eef1ff 100%);
  border-bottom:1px solid #e3e9ee;
}
.hero-inner{
  max-width:924px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:14px;}
.logo{
  width:52px;height:52px;flex:none;border-radius:16px;
  background:linear-gradient(135deg,var(--mint),#48c9e8);
  color:#fff;font-weight:800;font-size:22px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(47,191,155,.28);
}
.brand h1{margin:0;font-size:22px;letter-spacing:.5px;}
.subtitle{margin:2px 0 0;color:var(--muted);font-size:13px;}
.dashboard{display:flex;gap:12px;}
.stat{
  min-width:112px;background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.9);
  border-radius:16px;padding:12px 16px;text-align:center;box-shadow:0 4px 14px rgba(31,54,76,.05);
}
.stat-num{display:block;font-size:26px;font-weight:800;color:var(--mint-dark);line-height:1.2;}
.stat-warn .stat-num{color:var(--red);}
.stat-label{display:block;font-size:12px;color:var(--muted);margin-top:2px;}

/* ---------- 标签页 ---------- */
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.tab{
  flex:1;min-width:120px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);font-size:15px;font-weight:600;
  padding:13px 16px;border-radius:14px;cursor:pointer;
  transition:all .18s ease;
}
.tab:hover{border-color:var(--mint);color:var(--mint-dark);transform:translateY(-2px);box-shadow:var(--shadow);}
.tab:active{transform:translateY(0) scale(.98);}
.tab.active{
  background:linear-gradient(135deg,var(--mint),#3cc7b0);color:#fff;border-color:transparent;
  box-shadow:0 6px 18px rgba(47,191,155,.28);
}
.badge{
  display:inline-block;min-width:20px;padding:0 6px;margin-left:5px;
  background:rgba(255,255,255,.28);border-radius:10px;font-size:12px;
}
.tab:not(.active) .badge{background:var(--red-soft);color:var(--red);}

/* ---------- 卡片 ---------- */
.panel.hidden{display:none;}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:26px;box-shadow:var(--shadow);margin-bottom:20px;
}
.card-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
.card-icon{
  width:44px;height:44px;flex:none;border-radius:13px;background:var(--mint-soft);
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.card-head h2{margin:0;font-size:19px;}
.card-desc{margin:2px 0 0;color:var(--muted);font-size:13px;}

/* ---------- 表单 ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.field{margin-bottom:20px;}
.field>label{display:block;font-size:13px;font-weight:600;color:#5c6b7a;margin-bottom:8px;}
input[type=number],.answer-input,textarea{
  width:100%;border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;font-size:15px;color:var(--ink);background:#fdfefe;
  outline:none;transition:all .18s ease;font-family:inherit;
}
input[type=number]:focus,.answer-input:focus,textarea:focus{
  border-color:var(--mint);box-shadow:0 0 0 4px var(--mint-soft);background:#fff;
}
.input-error{border-color:var(--red)!important;box-shadow:0 0 0 4px var(--red-soft)!important;}

.radio-row{display:flex;gap:10px;flex-wrap:wrap;}
.radio{
  flex:1;min-width:108px;display:flex;align-items:center;justify-content:center;gap:8px;
  border:1.5px solid var(--line);border-radius:12px;padding:11px 10px;
  font-size:14px;cursor:pointer;transition:all .18s ease;background:#fdfefe;
}
.radio:hover{border-color:var(--mint);background:var(--mint-soft);}
.radio:has(input:checked){border-color:var(--mint);background:var(--mint-soft);color:var(--mint-dark);font-weight:600;}
.radio input{accent-color:var(--mint);width:16px;height:16px;margin:0;}

/* ---------- 按钮 ---------- */
.btn{
  border:none;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .18s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);}
.btn:active{transform:translateY(0) scale(.97);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.btn.primary{background:linear-gradient(135deg,var(--mint),var(--mint-dark));color:#fff;box-shadow:0 5px 14px rgba(47,191,155,.25);}
.btn.indigo{background:linear-gradient(135deg,var(--indigo),var(--indigo-dark));box-shadow:0 5px 14px rgba(106,127,224,.25);}
.btn.ghost{background:#f2f5f7;color:#5c6b7a;}
.btn.ghost:hover{background:#e8eef1;}
.btn.danger{background:var(--red-soft);color:var(--red);}
.btn.danger:hover{background:#fbd5d0;}
.btn.big{padding:15px 26px;font-size:16px;width:100%;margin-top:6px;}
.link-btn{
  border:none;background:none;color:var(--muted);font-size:13px;cursor:pointer;
  padding:8px 10px;font-family:inherit;transition:color .18s ease;
}
.link-btn:hover{color:var(--red);text-decoration:underline;}

/* ---------- 答题 ---------- */
.quiz-card{padding-top:22px;}
.progress{height:8px;background:#eef1f4;border-radius:8px;overflow:hidden;margin-bottom:10px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--mint),#4fd6bd);border-radius:8px;transition:width .3s ease;}
.progress-fill.indigo{background:linear-gradient(90deg,var(--indigo),#8a9aea);}
.progress-label{font-size:13px;color:var(--muted);text-align:right;margin-bottom:26px;}
.progress-label b{color:var(--ink);font-size:15px;}
.streak{color:var(--indigo)!important;}
.prompt{
  font-size:38px;font-weight:700;text-align:center;color:var(--ink);
  padding:36px 16px;background:linear-gradient(135deg,var(--mint-soft),var(--indigo-soft));
  border-radius:16px;margin-bottom:8px;word-break:break-word;line-height:1.35;
}
.dir-label{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px;}
.answer-row{display:flex;gap:12px;}
.answer-row .answer-input{flex:1;min-width:0;}
.answer-row .btn{flex:none;min-width:110px;}
.feedback{margin-top:18px;min-height:0;}
.result{
  display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:14px;
  animation:pop .25s ease;
}
.result.ok{background:var(--mint-soft);}
.result.bad{background:var(--red-soft);}
.result .mark{font-size:24px;font-weight:800;line-height:1.2;}
.result.ok .mark{color:var(--green);}
.result.bad .mark{color:var(--red);}
.result-title{font-weight:700;font-size:15px;}
.result.ok .result-title{color:var(--green);}
.result.bad .result-title{color:var(--red);}
.result-detail{font-size:14px;color:#4a5a69;margin-top:2px;}
.wrong-tip{font-size:13px;color:var(--red);margin-top:4px;font-weight:600;}
.next-row{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap;}
.next-row .btn{min-width:150px;}
.quiz-foot{text-align:center;margin-top:14px;}
@keyframes pop{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%,60%{transform:translateX(-7px);}
  40%,80%{transform:translateX(7px);}
}
.shake{animation:shake .35s ease;}

/* ---------- 结算 ---------- */
.center{text-align:center;padding:46px 26px;}
.result-emoji{font-size:56px;margin-bottom:10px;}
.center h2{margin:0 0 10px;font-size:24px;}
.result-text{color:var(--muted);font-size:16px;margin-bottom:28px;}
.result-text .wrong-num{color:var(--red);font-size:22px;}
.result-actions{display:flex;gap:14px;max-width:460px;margin:0 auto;}
.result-actions .btn{margin:0;}
.empty-state{
  background:var(--mint-soft);color:var(--mint-dark);border-radius:12px;
  padding:12px 16px;margin-bottom:20px;font-size:14px;
}

/* ---------- 词库管理 ---------- */
.import-card .card-icon{background:var(--indigo-soft);}
textarea{min-height:170px;resize:vertical;line-height:1.7;font-size:14px;}
.import-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:12px;flex-wrap:wrap;}
.import-tip{font-size:12px;color:var(--muted);}
.import-foot .btn{min-width:140px;}
.import-msg{margin-top:10px;font-size:13px;min-height:20px;}
.ok-text{color:var(--green);font-weight:600;}
.err-text{color:var(--red);font-weight:600;}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.list-head h2{margin:0;font-size:19px;}
.count-pill{
  background:var(--mint-soft);color:var(--mint-dark);border-radius:10px;
  padding:2px 10px;font-size:13px;vertical-align:middle;
}
.list-actions{display:flex;align-items:center;gap:14px;}
.checkall{display:flex;align-items:center;gap:6px;font-size:14px;color:#5c6b7a;cursor:pointer;}
.checkall input,.rowcheck{width:17px;height:17px;accent-color:var(--mint);cursor:pointer;}
.table-wrap{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:12px;}
.vocab-table{width:100%;border-collapse:collapse;font-size:14px;}
.vocab-table th{
  position:sticky;top:0;background:#f7f9fa;z-index:1;
  text-align:left;padding:12px 14px;color:var(--muted);font-weight:600;font-size:13px;
  border-bottom:1px solid var(--line);white-space:nowrap;
}
.vocab-table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
.vocab-table tr:last-child td{border-bottom:none;}
.vocab-table tbody tr:hover{background:#fbfdfd;}
.vocab-table .cbox{width:44px;text-align:center;}
.vocab-table .idx{width:64px;color:var(--muted);}
.vocab-table .word{font-weight:600;color:var(--ink);white-space:nowrap;}
.vocab-table .mean{color:#5c6b7a;}
.empty-row{text-align:center;color:var(--muted);padding:34px!important;}
.tag{font-size:12px;padding:3px 9px;border-radius:8px;white-space:nowrap;}
.tag.wrong{background:var(--red-soft);color:var(--red);}
.tag.ok{background:var(--mint-soft);color:var(--mint-dark);}

/* ---------- 提示 ---------- */
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
  background:#2b3a4a;color:#fff;padding:12px 22px;border-radius:12px;
  font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);
  opacity:0;pointer-events:none;transition:all .25s ease;z-index:99;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.error{background:var(--red);}
.footer{text-align:center;color:#aab6c1;font-size:12px;margin-top:8px;}

/* ---------- 移动端 ---------- */
@media(max-width:640px){
  .hero{padding:24px 16px 20px;}
  .brand h1{font-size:19px;}
  .dashboard{width:100%;}
  .stat{flex:1;min-width:0;}
  .tabs{gap:8px;}
  .tab{min-width:0;font-size:14px;padding:12px 8px;}
  .card{padding:20px 16px;}
  .form-grid{grid-template-columns:1fr;gap:14px;}
  .radio-row{flex-direction:column;}
  .radio{min-width:0;}
  .btn.big{padding:16px 20px;font-size:17px;}
  .prompt{font-size:30px;padding:28px 12px;}
  .answer-row{flex-direction:column;}
  .answer-row .btn{width:100%;min-height:50px;}
  .answer-input{min-height:50px;}
  .result-actions{flex-direction:column;}
  .answer-row .btn,.btn.big,.result-actions .btn{min-height:50px;}
  textarea{min-height:150px;font-size:16px;}
  .list-actions{width:100%;justify-content:space-between;}
  .table-wrap{max-height:380px;}
  .import-foot .btn{width:100%;}
}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="hero-inner">
      <div class="brand">
        <div class="logo">Aa</div>
        <div>
          <h1>高考英语词汇复习</h1>
          <p class="subtitle">每天一点点，词汇稳稳涨</p>
        </div>
      </div>
      <div class="dashboard">
        <div class="stat"><span class="stat-num" id="statTotal">0</span><span class="stat-label">总词汇数</span></div>
        <div class="stat stat-warn"><span class="stat-num" id="statWrong">0</span><span class="stat-label">错词本待消灭</span></div>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="review">常规复习</button>
    <button class="tab" data-tab="wrongbook">专属错词本 <span class="badge" id="wrongBadge">0</span></button>
    <button class="tab" data-tab="manage">词库管理</button>
  </nav>

  <main>
    <section class="panel" id="panel-review"></section>
    <section class="panel hidden" id="panel-wrongbook"></section>
    <section class="panel hidden" id="panel-manage"></section>
  </main>

  <p class="footer">数据保存在本机浏览器中 · 可离线使用</p>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ============ 存储与数据 ============ */
const KEY = 'gaokao_vocab';

function generateId(){
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9);
}

function seedData(){
  return [
    {word:'abandon',    meaning:'v. 放弃；抛弃；遗弃'},
    {word:'benefit',    meaning:'n. 益处；好处 v. 有益于'},
    {word:'contribute', meaning:'v. 贡献；捐献；促成'}
  ].map((s,i)=>({
    id:generateId(), index:i+1, word:s.word, meaning:s.meaning,
    inWrongBook:false, wrongBookStreak:0, wrongOrder:0
  }));
}

function saveData(){
  try{ localStorage.setItem(KEY, JSON.stringify(data)); }
  catch(e){ alert('保存失败，请检查浏览器存储设置。'); }
}

function loadData(){
  let d = null;
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) d = JSON.parse(raw);
  }catch(e){ d = null; }
  if(!Array.isArray(d)){
    d = seedData();
    try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){}
  }
  d.forEach(w=>{
    if(!w.id) w.id = generateId();
    if(typeof w.index !== 'number') w.index = 0;
    if(typeof w.word !== 'string') w.word = '';
    if(typeof w.meaning !== 'string') w.meaning = '';
    if(typeof w.inWrongBook !== 'boolean') w.inWrongBook = false;
    if(typeof w.wrongBookStreak !== 'number') w.wrongBookStreak = 0;
    if(typeof w.wrongOrder !== 'number') w.wrongOrder = 0;
  });
  return d;
}

// 一次性内置 642 词合并：只追加缺失词，保留用户已有的错词本状态与自定义词
const BULK_FLAG = 'gaokao_vocab_bulk_v642_v1';
function bulkImportOnce(){
  let done = false;
  try{ done = localStorage.getItem(BULK_FLAG) === '1'; }catch(e){}
  if(done) return;
  const existing = new Set(data.map(w=>w.word.trim().toLowerCase()));
  const aliases = new Set();
  data.forEach(w=>w.word.split(/\s*\/\s*/).forEach(p=>aliases.add(p.trim().toLowerCase())));
  BULK_WORDS.forEach(item=>{
    const key = item[0].toLowerCase();
    const parts = item[0].split(/\s*\/\s*/).map(p=>p.trim().toLowerCase());
    if(existing.has(key) || parts.some(p=>aliases.has(p))) return;
    existing.add(key); parts.forEach(p=>aliases.add(p));
    data.push({ id:generateId(), index:nextIndex(), word:item[0], meaning:item[1],
      inWrongBook:false, wrongBookStreak:0, wrongOrder:0 });
  });
  saveData();
  try{ localStorage.setItem(BULK_FLAG, '1'); }catch(e){}

const MORE_FLAG = 'gaokao_vocab_more_v375_v1';
function moreImportOnce(){
  let done = false;
  try{ done = localStorage.getItem(MORE_FLAG) === '1'; }catch(e){}
  if(done) return;
  const aliases = new Set();
  const addAlias = w => w.toLowerCase().split(/\s*\/\s*/).map(s=>s.trim()).filter(Boolean).forEach(a=>aliases.add(a));
  data.forEach(w=>addAlias(w.word));
  MORE_WORDS.forEach(item=>{
    const parts = item[0].toLowerCase().split(/\s*\/\s*/).map(s=>s.trim()).filter(Boolean);
    if(parts.some(p=>aliases.has(p))) return;
    parts.forEach(p=>aliases.add(p));
    data.push({ id:generateId(), index:nextIndex(), word:item[0], meaning:item[1],
      inWrongBook:false, wrongBookStreak:0, wrongOrder:0 });
  });
  saveData();
  try{ localStorage.setItem(MORE_FLAG, '1'); }catch(e){}
}

const FINAL_FLAG = 'gaokao_vocab_final_v304_v1';
function finalImportOnce(){
  let done = false;
  try{ done = localStorage.getItem(FINAL_FLAG) === '1'; }catch(e){}
  if(done) return;
  const aliases = new Set();
  const addAlias = w => w.toLowerCase().split(/\s*\/\s*/).map(s=>s.trim()).filter(Boolean).forEach(a=>aliases.add(a));
  data.forEach(w=>addAlias(w.word));
  FINAL_WORDS.forEach(item=>{
    const parts = item[0].toLowerCase().split(/\s*\/\s*/).map(s=>s.trim()).filter(Boolean);
    if(parts.some(p=>aliases.has(p))) return;
    parts.forEach(p=>aliases.add(p));
    data.push({ id:generateId(), index:nextIndex(), word:item[0], meaning:item[1],
      inWrongBook:false, wrongBookStreak:0, wrongOrder:0 });
  });
  saveData();
  try{ localStorage.setItem(FINAL_FLAG, '1'); }catch(e){}
}

// 一次性追加本批 550 条词汇（自动跳过词库中已有词）
const ULTRA_FLAG = 'gaokao_vocab_ultra_v550_v1';
function ultraImportOnce(){
  let done = false;
  try{ done = localStorage.getItem(ULTRA_FLAG) === '1'; }catch(e){}
  if(done) return;
  const aliases = new Set();
  const addAlias = w => w.toLowerCase().split(/\s*\/\s*/).map(s=>s.trim()).filter(Boolean).forEach(a=>aliases.add(a));
  data.forEach(w=>addAlias(w.word));
  ULTRA_WORDS.forEach(item=>{
    const parts = item[0].toLowerCase().split(/\s*\/\s*/).map(s=>s.trim()).filter(Boolean);
    if(parts.some(p=>aliases.has(p))) return;
    parts.forEach(p=>aliases.add(p));
    data.push({ id:generateId(), index:nextIndex(), word:item[0], meaning:item[1],
      inWrongBook:false, wrongBookStreak:0, wrongOrder:0 });
  });
  saveData();
  try{ localStorage.setItem(ULTRA_FLAG, '1'); }catch(e){}
}
ultraImportOnce();

function nextIndex(){
  return data.reduce((m,w)=>Math.max(m, w.index||0), 0) + 1;
}
function maxIndex(){
  return data.reduce((m,w)=>Math.max(m, w.index||0), 0) || 1;
}
function byId(id){ return data.find(w=>w.id===id); }

/* ============ 全局状态 ============ */
const state = {
  activeTab:'review',
  review:{ screen:'setup', queue:[], pos:0, wrong:0, answered:false, q:null, lastChange:null, direction:'e2c' },
  wrongbook:{ screen:'setup', queue:[], pos:0, answered:false, q:null, direction:'e2c', order:'random', lastChange:null },
  manage:{ selected:new Set(), importText:'', importMsg:'' }
};

function el(id){ return document.getElementById(id); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function updateDashboard(){
  const wc = data.filter(w=>w.inWrongBook).length;
  el('statTotal').textContent = data.length;
  el('statWrong').textContent = wc;
  el('wrongBadge').textContent = wc;
}

let toastTimer;
function toast(msg, type){
  const t = el('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className='toast'; }, 2200);
}
function shake(node){
  node.classList.remove('shake','input-error');
  void node.offsetWidth;
  node.classList.add('shake','input-error');
  node.focus();
}

/* ============ 通用判定 ============ */
function normalize(str){
  return String(str).toLowerCase().replace(/[\s\p{P}\p{S}\p{M}]/gu, '');
}
function isMatch(input, answer){
  const a = normalize(input), b = normalize(answer);
  if(!a || !b) return false;
  return a.indexOf(b) !== -1 || b.indexOf(a) !== -1;
}
function makeQuestion(word, direction){
  const dir = direction === 'mixed' ? (Math.random() < .5 ? 'e2c' : 'c2e') : direction;
  return dir === 'e2c'
    ? { dir, prompt:word.word,     answer:word.meaning, label:'英译中 · 请输入中文释义', wordId:word.id }
    : { dir, prompt:word.meaning, answer:word.word,    label:'中译英 · 请输入英文单词', wordId:word.id };
}

/* ============ 标签切换 ============ */
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const tab = btn.dataset.tab;
    state.activeTab = tab;
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b===btn));
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('hidden', p.id !== 'panel-'+tab));
    if(tab === 'manage') renderManage();
  });
});

/* ====================================================
   模块一：常规复习
   ==================================================== */
function renderReview(){
  const p = el('panel-review'), s = state.review;
  if(s.screen === 'setup'){
    p.innerHTML = `
      <div class="card">
        <div class="card-head">
          <div class="card-icon">📖</div>
          <div><h2>常规复习</h2><p class="card-desc">按序号范围复习，答错的词会自动进入错词本</p></div>
        </div>
        <div class="form-grid">
          <div class="field" style="margin-bottom:0"><label>起始序号</label><input type="number" id="rStart" min="1" value="1"></div>
          <div class="field" style="margin-bottom:0"><label>结束序号</label><input type="number" id="rEnd" min="1" value="${maxIndex()}"></div>
        </div>
        <div class="field" style="margin-top:20px"><label>复习方向</label>
          <div class="radio-row">
            <label class="radio"><input type="radio" name="rdir" value="e2c" ${s.direction==='e2c'?'checked':''}><span>英译中</span></label>
            <label class="radio"><input type="radio" name="rdir" value="c2e" ${s.direction==='c2e'?'checked':''}><span>中译英</span></label>
            <label class="radio"><input type="radio" name="rdir" value="mixed" ${s.direction==='mixed'?'checked':''}><span>随机混合</span></label>
          </div>
        </div>
        <button class="btn primary big" id="rStartBtn">开始复习 →</button>
      </div>`;
    el('rStartBtn').addEventListener('click', startReview);
  }else if(s.screen === 'quiz'){
    renderReviewQuestion();
  }else if(s.screen === 'result'){
    p.innerHTML = `
      <div class="card center">
        <div class="result-emoji">🎉</div>
        <h2>本轮复习已完成！</h2>
        <p class="result-text">本轮共答错 <b class="wrong-num">${s.wrong}</b> 个词。</p>
        <div class="result-actions">
          <button class="btn primary big" id="goWrong">去消灭错题</button>
          <button class="btn ghost big" id="exitReview">退出常规复习</button>
        </div>
      </div>`;
    el('goWrong').addEventListener('click', ()=>{
      state.wrongbook.screen = 'setup';
      renderWrongbook();
      document.querySelector('.tab[data-tab="wrongbook"]').click();
    });
    el('exitReview').addEventListener('click', ()=>{ s.screen='setup'; renderReview(); });
  }
}

function startReview(){
  const s = state.review;
  let start = parseInt(el('rStart').value, 10);
  let end   = parseInt(el('rEnd').value, 10);
  if(isNaN(start) || start < 1) start = 1;
  if(isNaN(end)   || end   < 1) end = maxIndex();
  if(start > end){ toast('起始序号不能大于结束序号', 'error'); return; }
  s.direction = document.querySelector('input[name="rdir"]:checked').value;
  s.queue = data.filter(w=>w.index>=start && w.index<=end)
                .sort((a,b)=>a.index-b.index).map(w=>w.id);
  if(!s.queue.length){ toast('该序号范围内没有词汇', 'error'); return; }
  s.pos=0; s.wrong=0; s.answered=false; s.lastChange=null;
  s.screen='quiz';
  renderReview();
}

function renderReviewQuestion(){
  const s = state.review;
  const word = byId(s.queue[s.pos]);
  s.q = makeQuestion(word, s.direction);
  s.answered = false;
  const pct = Math.round(s.pos / s.queue.length * 100);
  el('panel-review').innerHTML = `
    <div class="card quiz-card">
      <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">当前进度：第 <b>${s.pos+1}</b> / ${s.queue.length} 个</div>
      <div class="prompt">${escapeHtml(s.q.prompt)}</div>
      <div class="dir-label">${s.q.label}</div>
      <div class="answer-row">
        <input id="rAnswer" class="answer-input" placeholder="在这里输入答案…" autocomplete="off">
        <button class="btn primary" id="rSubmit">提交</button>
      </div>
      <div class="feedback" id="rFeedback"></div>
      <div class="quiz-foot"><button class="link-btn" id="rExit">退出复习</button></div>
    </div>`;
  el('rSubmit').addEventListener('click', submitReview);
  el('rAnswer').addEventListener('keydown', e=>{ if(e.key==='Enter') submitReview(); });
  el('rAnswer').addEventListener('input', e=>e.target.classList.remove('input-error'));
  el('rExit').addEventListener('click', ()=>{ s.screen='setup'; renderReview(); });
  el('rAnswer').focus();
}

/* 【常规复习 · 判定错误即时写入】错一个，立刻存一个。
   集中保证 4 件事：置 inWrongBook=true、wrongBookStreak=0、
   wrongOrder=当前时间戳、立即 saveData() 落盘（不等整轮复习结束）。
   作用范围仅限常规复习的判定错误分支；撤销、错词本、词库管理与界面均不受影响。 */
function markWrongAndSave(word){
  if(!word) return;
  word.inWrongBook = true;
  word.wrongBookStreak = 0;
  word.wrongOrder = Date.now();
  saveData();
}

function submitReview(){
  const s = state.review;
  if(s.answered) return;
  const input = el('rAnswer');
  const val = input.value.trim();
  if(!val){ shake(input); return; }

  const correct = isMatch(val, s.q.answer);
  const word = byId(s.q.wordId);
  const fb = el('rFeedback');
  s.answered = true;

  if(correct){
    fb.innerHTML = `
      <div class="result ok">
        <span class="mark">✔</span>
        <div><div class="result-title">回答正确！</div>
        <div class="result-detail">${escapeHtml(word.word)} — ${escapeHtml(word.meaning)}</div></div>
      </div>
      <div class="next-row"><button class="btn primary" id="rNext">下一题 →</button></div>`;
    el('rNext').addEventListener('click', nextReviewQuestion);
  }else{
    s.wrong++;
    s.lastChange = { id:word.id, prev:{
      inWrongBook:word.inWrongBook, wrongBookStreak:word.wrongBookStreak, wrongOrder:word.wrongOrder
    }};
    // 判定为错误 → 立刻写入错词本并即时落盘（错一个，存一个）
    markWrongAndSave(word);
    updateDashboard();
    fb.innerHTML = `
      <div class="result bad">
        <span class="mark">✘</span>
        <div><div class="result-title">回答错误</div>
        <div class="result-detail">正确答案：${escapeHtml(s.q.answer)}</div>
        <div class="wrong-tip">已加入错词本</div></div>
      </div>
      <div class="next-row">
        <button class="btn primary" id="rNext">下一题 →</button>
        <button class="link-btn" id="rUndo">我其实答对了</button>
      </div>`;
    el('rNext').addEventListener('click', nextReviewQuestion);
    el('rUndo').addEventListener('click', undoWrong);
  }
  input.disabled = true;
  el('rSubmit').disabled = true;
}

function undoWrong(){
  const s = state.review;
  if(s.lastChange){
    const w = byId(s.lastChange.id);
    if(w) Object.assign(w, s.lastChange.prev);
    if(s.wrong > 0) s.wrong--;
    s.lastChange = null;
    saveData(); updateDashboard();
    toast('已撤销加入错词本');
  }
  nextReviewQuestion();
}

function nextReviewQuestion(){
  const s = state.review;
  s.pos++;
  if(s.pos >= s.queue.length){ s.screen='result'; renderReview(); }
  else renderReviewQuestion();
}

/* ====================================================
   模块二：专属错词本
   ==================================================== */
function renderWrongbook(){
  const p = el('panel-wrongbook'), s = state.wrongbook;
  if(s.screen === 'setup'){
    const count = data.filter(w=>w.inWrongBook).length;
    p.innerHTML = `
      <div class="card">
        <div class="card-head">
          <div class="card-icon" style="background:var(--indigo-soft)">🎯</div>
          <div><h2>专属错词本</h2><p class="card-desc">连续答对 3 次即可将单词移出错词本</p></div>
        </div>
        ${count===0 ? '<div class="empty-state">错词本空空的，先去常规复习制造一些错题吧～</div>' : ''}
        <div class="field"><label>出题方向</label>
          <div class="radio-row">
            <label class="radio"><input type="radio" name="wdir" value="e2c" ${s.direction==='e2c'?'checked':''}><span>英译中</span></label>
            <label class="radio"><input type="radio" name="wdir" value="c2e" ${s.direction==='c2e'?'checked':''}><span>中译英</span></label>
            <label class="radio"><input type="radio" name="wdir" value="mixed" ${s.direction==='mixed'?'checked':''}><span>随机混合</span></label>
          </div>
        </div>
        <div class="field"><label>复习顺序</label>
          <div class="radio-row">
            <label class="radio"><input type="radio" name="worder" value="random" ${s.order==='random'?'checked':''}><span>乱序（随机打乱）</span></label>
            <label class="radio"><input type="radio" name="worder" value="time" ${s.order==='time'?'checked':''}><span>按录入顺序（按错题加入的时间先后）</span></label>
          </div>
        </div>
        <button class="btn primary indigo big" id="wStart" ${count===0?'disabled':''}>开始消灭错题 →</button>
      </div>`;
    document.querySelectorAll('input[name="wdir"]').forEach(r=>r.addEventListener('change', e=>s.direction=e.target.value));
    document.querySelectorAll('input[name="worder"]').forEach(r=>r.addEventListener('change', e=>s.order=e.target.value));
    if(count>0) el('wStart').addEventListener('click', startWrongbook);
  }else if(s.screen === 'quiz'){
    renderWrongQuestion();
  }else if(s.screen === 'done'){
    p.innerHTML = `
      <div class="card center">
        <div class="result-emoji">🏆</div>
        <h2>今日错题已清理完毕！</h2>
        <p class="result-text">坚持就是胜利，继续保持～</p>
        <div class="result-actions">
          <button class="btn primary indigo big" id="wBack">返回错词本</button>
          <button class="btn ghost big" id="wHome">回到常规复习</button>
        </div>
      </div>`;
    el('wBack').addEventListener('click', ()=>{ s.screen='setup'; renderWrongbook(); });
    el('wHome').addEventListener('click', ()=>document.querySelector('.tab[data-tab="review"]').click());
  }
}

function startWrongbook(){
  const s = state.wrongbook;
  s.direction = document.querySelector('input[name="wdir"]:checked').value;
  s.order     = document.querySelector('input[name="worder"]:checked').value;
  let list = data.filter(w=>w.inWrongBook);
  if(!list.length){ toast('错词本里还没有词', 'error'); return; }
  if(s.order === 'time'){
    // 按错题加入的时间先后（先加入的在前）
    list.sort((a,b)=>a.wrongOrder - b.wrongOrder);
  }else{
    // 乱序：Fisher-Yates 随机打乱
    for(let i=list.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      const t = list[i]; list[i] = list[j]; list[j] = t;
    }
  }
  s.queue = list.map(w=>w.id);
  s.pos = 0; s.answered = false; s.lastChange = null;
  s.screen = 'quiz';
  renderWrongbook();
}

function renderWrongQuestion(){
  const s = state.wrongbook;
  const word = byId(s.queue[s.pos]);
  s.q = makeQuestion(word, s.direction);
  s.answered = false;
  s.lastChange = null;
  const pct = Math.round(s.pos / s.queue.length * 100);
  el('panel-wrongbook').innerHTML = `
    <div class="card quiz-card">
      <div class="progress"><div class="progress-fill indigo" style="width:${pct}%"></div></div>
      <div class="progress-label">第 <b>${s.pos+1}</b> / ${s.queue.length} 个 · 连续答对进度：<b class="streak" id="wStreak">${word.wrongBookStreak}</b> / 3</div>
      <div class="prompt">${escapeHtml(s.q.prompt)}</div>
      <div class="dir-label">${s.q.label}</div>
      <div class="answer-row">
        <input id="wAnswer" class="answer-input" placeholder="在这里输入答案…" autocomplete="off">
        <button class="btn primary indigo" id="wSubmit">提交</button>
      </div>
      <div class="feedback" id="wFeedback"></div>
      <div class="quiz-foot"><button class="link-btn" id="wExit">退出</button></div>
    </div>`;
  el('wSubmit').addEventListener('click', submitWrong);
  el('wAnswer').addEventListener('keydown', e=>{ if(e.key==='Enter') submitWrong(); });
  el('wAnswer').addEventListener('input', e=>e.target.classList.remove('input-error'));
  el('wExit').addEventListener('click', ()=>{ s.screen='setup'; renderWrongbook(); });
  el('wAnswer').focus();
}

// 答对后的统一处理：连击 +1、满 3 次移出错词本、更新进度提示
function wrongCorrectResult(word){
  let msg, graduated = false;
  if(word.wrongBookStreak >= 3){
    word.inWrongBook = false;
    word.wrongBookStreak = 0;
    word.wrongOrder = 0;
    msg = '🎉 已移出错词本！';
    graduated = true;
  }else{
    msg = '✅ 答对啦，再对 ' + (3 - word.wrongBookStreak) + ' 次即可毕业';
  }
  saveData(); updateDashboard();
  const streakEl = el('wStreak');
  if(streakEl) streakEl.textContent = graduated ? '3' : String(word.wrongBookStreak);

  const fb = el('wFeedback');
  fb.innerHTML = `
    <div class="result ok">
      <span class="mark">✔</span>
      <div><div class="result-title">回答正确</div><div class="result-detail">${msg}</div></div>
    </div>
    <div class="next-row"><button class="btn primary indigo" id="wNext">下一题 →</button></div>`;
  el('wNext').addEventListener('click', nextWrongQuestion);
  const input = el('wAnswer'); if(input) input.disabled = true;
  const sub = el('wSubmit'); if(sub) sub.disabled = true;
}

// 错词本唯一兜底按钮：无论输入了什么，都按「答对」处理
function acceptWrongAsCorrect(){
  const s = state.wrongbook;
  if(!s.answered) return;
  const word = byId(s.q.wordId);
  if(!word) return;

  // 先还原误判造成的连击归零与 wrongOrder 更新，再执行正常答对逻辑
  if(s.lastChange){
    const w = byId(s.lastChange.id);
    if(w) Object.assign(w, s.lastChange.prev);
    s.lastChange = null;
  }
  word.wrongBookStreak++;
  wrongCorrectResult(word);
}

function submitWrong(){
  const s = state.wrongbook;
  if(s.answered) return;
  const input = el('wAnswer');
  const val = input.value.trim();
  if(!val){ shake(input); return; }

  const correct = isMatch(val, s.q.answer);
  const word = byId(s.q.wordId);
  s.answered = true;

  if(correct){
    s.lastChange = null;
    word.wrongBookStreak++;
    wrongCorrectResult(word);
  }else{
    // 保存答错前状态，供「我其实答对了」撤销
    s.lastChange = { id:word.id, prev:{
      wrongBookStreak:word.wrongBookStreak, wrongOrder:word.wrongOrder
    }};
    word.wrongBookStreak = 0;
    word.wrongOrder = Date.now();
    saveData(); updateDashboard();
    const fb = el('wFeedback');
    fb.innerHTML = `
      <div class="result bad">
        <span class="mark">✘</span>
        <div><div class="result-title">回答错误</div>
        <div class="result-detail">正确答案：${escapeHtml(s.q.answer)}</div>
        <div class="wrong-tip">连续进度已归零，继续留在错词本</div></div>
      </div>
      <div class="next-row">
        <button class="btn primary indigo" id="wNext">下一题 →</button>
        <button class="link-btn" id="wOverride">我其实答对了（算作正确）</button>
      </div>`;
    el('wNext').addEventListener('click', nextWrongQuestion);
    el('wOverride').addEventListener('click', acceptWrongAsCorrect);
  }
  input.disabled = true;
  el('wSubmit').disabled = true;
}

function nextWrongQuestion(){
  const s = state.wrongbook;
  s.pos++;
  if(s.pos >= s.queue.length){ s.screen='done'; renderWrongbook(); }
  else renderWrongQuestion();
}

/* ====================================================
   模块三：词库管理
   ==================================================== */
function splitLine(line){
  // 以「第一个中文字符」作为英文与中文释义的分界，而不再依赖 Tab / 逗号 / 空格
  const m = line.search(/[\u4e00-\u9fa5]/);
  if(m === -1) return null;           // 没有中文：表头或格式错误行，直接跳过
  if(m === 0) return null;            // 没有英文部分，视为无效行

  let word = line.slice(0, m).replace(/[\s,，;；:：\t]+$/, '').trim();
  // 去掉英文后面可能残留的词性标记（如 "state n." -> "state"），保证 word 纯净
  word = word.replace(/[\s,，;；:：\t]+(?:n|v|vt|vi|adj|adv|prep|conj|pron|art|num|int|abbr)\.?$/i, '').trim();
  const meaning = line.slice(m).trim();

  if(!word || !meaning) return null;
  return [word, meaning];
}
function isHeader(word, meaning){
  const a = word.toLowerCase().trim();
  const b = meaning.toLowerCase().trim();
  const first  = ['word','单词','英文','english','词汇','english word'];
  const second = ['meaning','释义','中文','中文释义','意思','translation','解释','翻译'];
  const allHeaderTokens = first.concat(second);
  const tokens = a.split(/[\s,，、/]+/).filter(Boolean);
  const aIsHeader = tokens.length > 0 && tokens.every(t=>allHeaderTokens.indexOf(t) !== -1);
  return aIsHeader && second.some(h=>b.indexOf(h) !== -1);
}

function renderManage(){
  const p = el('panel-manage');
  const sorted = data.slice().sort((a,b)=>a.index-b.index);
  const sel = state.manage.selected;
  [...sel].forEach(id=>{ if(!byId(id)) sel.delete(id); });
  const allChecked = sorted.length>0 && sorted.every(w=>sel.has(w.id));

  const rows = sorted.map(w=>`
    <tr>
      <td class="cbox"><input type="checkbox" class="rowcheck" data-id="${w.id}" ${sel.has(w.id)?'checked':''}></td>
      <td class="idx">${w.index}</td>
      <td class="word">${escapeHtml(w.word)}</td>
      <td class="mean">${escapeHtml(w.meaning)}</td>
      <td>${w.inWrongBook ? '<span class="tag wrong">错词本</span>' : '<span class="tag ok">正常</span>'}</td>
    </tr>`).join('');

  p.innerHTML = `
    <div class="card import-card">
      <div class="card-head">
        <div class="card-icon">📥</div>
        <div><h2>一键导入词库</h2><p class="card-desc">支持从 Excel 直接复制粘贴，自动识别 Tab / 逗号 / 空格分隔</p></div>
      </div>
      <textarea id="importArea" placeholder="请从 Excel 直接复制（英文 和 中文），粘贴到这里&#10;例如：&#10;abandon    放弃；抛弃&#10;benefit, 益处；好处">${escapeHtml(state.manage.importText)}</textarea>
      <div class="import-foot">
        <span class="import-tip">重复单词会自动跳过 · 表头与空行自动过滤</span>
        <button class="btn primary" id="importBtn">导入词库</button>
      </div>
      <div class="import-msg">${state.manage.importMsg}</div>
    </div>
    <div class="card">
      <div class="list-head">
        <h2>词汇列表 <span class="count-pill">${data.length}</span></h2>
        <div class="list-actions">
          <label class="checkall"><input type="checkbox" id="checkAll" ${allChecked?'checked':''}> 全选</label>
          <button class="btn danger" id="deleteSelected" ${sel.size?'':'disabled'}>删除所选 (${sel.size})</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="vocab-table">
          <thead><tr><th class="cbox"></th><th>序号</th><th>英文单词</th><th>中文释义</th><th>状态</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="5" class="empty-row">还没有词汇，请先导入</td></tr>'}</tbody>
        </table>
      </div>
    </div>`;

  el('importArea').addEventListener('input', e=>{ state.manage.importText = e.target.value; });
  el('importBtn').addEventListener('click', doImport);
  el('checkAll').addEventListener('change', e=>{
    if(e.target.checked) sorted.forEach(w=>sel.add(w.id)); else sel.clear();
    renderManage();
  });
  document.querySelectorAll('.rowcheck').forEach(cb=>cb.addEventListener('change', e=>{
    if(e.target.checked) sel.add(e.target.dataset.id); else sel.delete(e.target.dataset.id);
    renderManage();
  }));
  el('deleteSelected').addEventListener('click', deleteSelected);
}

function doImport(){
  const text = el('importArea').value;
  if(!text.trim()){ shake(el('importArea')); toast('请先粘贴内容', 'error'); return; }

  const existing = new Set(data.map(w=>w.word.trim().toLowerCase()));
  let added = 0, skipped = 0;
  text.split(/\r?\n/).forEach(line=>{
    line = line.trim();
    if(!line) return;
    const parts = splitLine(line);
    if(!parts){ skipped++; return; }
    if(isHeader(parts[0], parts[1])){ skipped++; return; }
    const key = parts[0].toLowerCase();
    if(existing.has(key)){ skipped++; return; }
    existing.add(key);
    data.push({
      id:generateId(), index:nextIndex(), word:parts[0], meaning:parts[1],
      inWrongBook:false, wrongBookStreak:0, wrongOrder:0
    });
    added++;
  });

  saveData(); updateDashboard();
  state.manage.importText = '';
  state.manage.importMsg = added
    ? `<span class="ok-text">✅ 成功导入 ${added} 个词${skipped ? '，跳过 '+skipped+' 行（重复 / 表头 / 无效）' : ''}</span>`
    : `<span class="err-text">⚠️ 没有导入任何新词${skipped ? '，跳过 '+skipped+' 行' : ''}</span>`;
  renderManage();
}

function deleteSelected(){
  const sel = state.manage.selected;
  if(!sel.size) return;
  const n = sel.size;
  if(!confirm('确定删除选中的 ' + n + ' 个词吗？此操作不可恢复。')) return;
  data = data.filter(w=>!sel.has(w.id));
  data.sort((a,b)=>a.index-b.index).forEach((w,i)=>w.index = i+1);
  saveData(); updateDashboard();
  sel.clear();
  renderManage();
  toast('已删除 ' + n + ' 个词');
}

/* ============ 初始化 ============ */
updateDashboard();
renderReview();
renderWrongbook();
renderManage();
})();
</script>
